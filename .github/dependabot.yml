version: 2
updates:
  # RESTORED 2026-11-04 as the `bun` ecosystem. The entry was removed 2026-10-01 because
  # Dependabot's bundled bun read only bun.lock lockfileVersion 1 while Bun 1.4 writes 2
  # ("Unsupported bun.lock 'lockfileVersion' 2"), and the npm_and_yarn ecosystem aborts on a
  # bun.lock during file fetching. The recorded revisit condition is now met upstream:
  # dependabot/dependabot-core#16485 (merged 2026-10-06) bundles Bun 1.4.2 and accepts
  # lockfileVersion 0-3. The FIRST scheduled run of this entry is the test: a failure is
  # immediate and costs nothing. If it still reports "Unsupported bun.lock", hosted Dependabot
  # has not yet picked up that release; leave the entry and wait, do not pin Bun back to 1.3.14.
  # With the bun ecosystem Dependabot writes bun.lock itself; `dependabot-bun-lock.yml` stays as
  # the no-op safety net (it commits only when `bun install` changes the lockfile).
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: "development"
      production-dependencies:
        dependency-type: "production"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    ignore:
      # Deliberately ABSENT (removed 2026-09, do not re-add): a typescript VERSION ignore (the
      # root is on 7.x on purpose; the semver-major entry below is the scoped form), an eslint
      # ignore (linting is oxlint; eslint is not a dependency), the vitest / @vitest/coverage-v8
      # >=4 ignores (5 is installed, gates pass), and a @dimforge/rapier{2,3}d-compat 0.20 ignore
      # (0.20.0 adopted 2026-09-06; the goldens track it).
      #
      # BLOCKED by a vendored tool. js-yaml 5 removed its default export and
      # tools/create-dependency-graph does `import yaml from 'js-yaml'`, so `bun run graph` dies
      # with "Missing 'default' export" before reading a file. That tool is kept BYTE-IDENTICAL
      # with the copy in llm-wiki (see .oxlintrc.json ignorePatterns); changing the import here
      # would guarantee the two copies drift. Lift only when both copies move together.
      - dependency-name: "js-yaml"
        versions: [">=5"]
      # harfbuzzjs is pinned at EXACTLY 0.4.13, the supported ABI for the optional shaping
      # adapter: 1.x removed the explicit Wasm init/disposal APIs (hb.js / hbjs.js) that
      # packages/text/src/harfbuzz uses (#96 merged 2026-09-12, reverted in d9347f2; #103
      # re-proposed), and any other version fails tests/harfbuzz.test.ts "pins wasm", which
      # asserts the SHA-256 of the 0.4.13 hb.wasm (#106 proposed 0.10.3 and failed exactly there).
      # Lift only together with an adapter migration and a new wasm pin.
      - dependency-name: "harfbuzzjs"
        versions: [">0.4.13"]
      # tools/docs must stay on TypeScript 6.x until TypeDoc supports 7 (typedoc#3098), but the
      # root dev-dependency group bumped it to 7.0.2 every week (#82, #102, #105, #108, #116),
      # each needing the same revert. An ignore cannot be scoped to one workspace, so a
      # MAJOR-only ignore is the scoped fix in practice: the root (already on 7.x) still receives
      # every 7.x minor and patch; only the 6 -> 7 jump in tools/docs is held back. Remove when
      # tools/docs moves to TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Keep the action versions current. Grouped so a week of bumps is one PR, not six.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
