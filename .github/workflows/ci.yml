name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release.yml calls this workflow rather than restating its job set, so a
  # release clears exactly the gates a pull request clears. Additive: it changes
  # nothing about how CI runs on push or pull_request.
  workflow_call:
  # dependabot-bun-lock.yml dispatches this onto a regenerated lockfile commit.
  # A GITHUB_TOKEN push does not create a new pull_request run, so this is how
  # that SHA gets a CI check. The install step below stays --frozen-lockfile.
  workflow_dispatch:

jobs:
  ci:
    name: Build, test, and checks
    runs-on: ubuntu-latest
    # Measured 2026-09-16: five consecutive runs took 10m30s-11m20s. This bound is ~2.7x that
    # p100 - high enough never to cut a legitimately slow run, low enough that a wedge fails
    # fast. Run 35096863762 hung 48m23s on "Browser test" against that same envelope and
    # ignored a cancel request for minutes; with no bound, nothing would have stopped it
    # before GitHub's 6-hour job ceiling. release.yml's `ci:` job calls this workflow with
    # `uses:`, and a reusable-workflow caller cannot carry timeout-minutes, so this line is
    # also the only bound the release pipeline's CI stage will ever have.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Bun is the workspace package manager and script runner (RFC 0006).
      # Node stays installed for Playwright's browser install helpers and the
      # two `node --test` tool suites (`publish-names:test`, `graph:test`).
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # FORMAT GATE, placed here deliberately - early and before Build.
      #
      # Until 2026-09-16 CI had no formatting check at all, so `main` could be (and was) green
      # while 248 files were unformatted. Running it immediately after install means an
      # unformatted pull request fails in about a minute instead of after a ~10-minute build and
      # test cycle, and a format failure is never mistaken for a test failure.
      #
      # Measured on this repo 2026-09-16: `prettier --check .` took 96s cold and 51-56s warm.
      # That is real cost against a ~10m30s job, which is why it is a step in this job rather
      # than a separate one - a parallel job would repeat checkout, Bun setup and install to
      # save less time than that setup costs.
      #
      # This gate assumes .gitattributes pins eol=lf. Without that pin the check is unstable by
      # platform: a Windows working tree is CRLF while the git objects and this runner are LF,
      # so prettier (endOfLine=lf by default) disagrees with itself across machines for the same
      # commit. Do not remove the pin and keep this step.
      - name: Check formatting
        run: bun run format:check

      - name: Build
        run: bun run build

      # The examples are consumers, not workspace packages: they import the
      # umbrella package by its published specifier, which resolves to
      # `packages/fourjs/dist/*.d.ts`. The build step above must therefore precede
      # this one.
      - name: Typecheck examples
        run: bun run typecheck:examples

      # `tests/` is outside every package's tsc project and outside the examples
      # project, so until 2026-08-21 nothing type-checked the cross-package
      # suites: option-object typos (`new OrthographicCamera({ height, aspect })`
      # — fields that type does not declare) were accepted and silently ignored,
      # and three integration harnesses asserted on invisible draws for it
      # (R-8). `tests/tsconfig.json` already existed; this is the step that runs
      # it. Placed after Build for the same reason as the examples: the suites
      # import `four/*` through the workspace symlink into `packages/fourjs/dist`.
      - name: Typecheck tests
        run: bun run typecheck:tests

      - name: Typecheck benchmarks (host doubles against the renderer contracts)
        run: bun run typecheck:benchmarks

      # The root config files (playwright.config.ts, the two vitest configs) had no
      # owning tsconfig at all until 2026-09-08, so nothing type-checked them and
      # type-aware lint read them through an inferred project that silently lost
      # @types/node on TypeScript 6. They have a real project now; this gates it.
      - name: Typecheck root config files
        run: bun run typecheck:config

      # The ROOT is TypeScript 7 only (2026-09-08). One consumer of TypeScript 6
      # survives: TypeDoc, isolated in tools/docs with typescript@6.0.3 as a direct
      # dependency, because TS 7 removed the legacy compiler API TypeDoc depends on.
      #
      # TypeDoc still PARSES this source with that 6.0.3, so two compilers read the
      # code and they DO disagree -- 6.0 rejects the `.ts` import extensions in three
      # §93 examples that 5.9 and 7.0 both accept. This gate runs the isolated 6.0.3
      # over the same projects, so a divergence is a red build rather than a docs
      # build that silently stops covering part of the library.
      - name: Typecheck under TypeScript 6 (isolated docs compiler cross-check)
        run: bun run typecheck:ts6

      - name: Test
        run: bun run test

      # Same unit tests, re-run per package under v8 instrumentation against the
      # shared thresholds in vitest.coverage.config.ts. Kept separate so the
      # plain `test` path above stays uninstrumented and fast.
      - name: Unit test coverage thresholds
        run: bun run coverage

      - name: Lint
        run: bun run lint

      - name: Check release-name mapping and export preservation
        run: bun run publish-names:test

      - name: Check specification
        run: bun run check-spec

      # Doc-truth gate (added 2026-08-05). Prose has no type checker: the sweep
      # that added this found claims that were false when written and survived
      # for months. check-docs pins the ones that were fixed by hand — example
      # counts against `git ls-files`, placeholder directories that docs must
      # not send readers to, and the exact retired wordings — so a revert or a
      # copy-paste from an old revision fails here instead of shipping.
      - name: Check documentation truth
        run: bun run check-docs

      # §90 compatibility drift (added 2026-08-07). The solver-adapter block of
      # docs/COMPATIBILITY.md is generated from the adapters' live capability
      # declarations; this fails when an adapter's declaration changes without
      # the committed document being regenerated. Needs the build step above
      # (the generator imports each package's dist).
      - name: Check compatibility tables
        run: bun run check-compat

      # Architecture invariants. `graph` regenerates docs/Architecture from a full
      # parse; `graph:check` then asserts every browser-facing `.` entry stays free
      # of node: builtins. four.js targets the browser, so a node: import reaching a
      # package's main entry is a shipping bug, and it is invisible to tsc and to
      # unit tests running under Node. `graph:duplicates` reads the report `graph`
      # just regenerated (hence --no-regen in the script) and fails on any
      # TRUE_DUPLICATE symbol name beyond docs/Architecture/duplicate-baseline.json.
      - name: Check architecture invariants (dependency graph)
        run: |
          bun run graph
          bun run graph:check
          bun run graph:duplicates
          bun run graph:test

      # TypeDoc reads the built reference chain; `bun run docs` (not a bare
      # `bun docs`) is required so the root script wins.
      - name: Build API docs
        run: bun run docs

      # All example sites must be built: playwright.config.ts starts a
      # vite preview server per example, and vite preview hard-errors on a
      # missing dist (found at the Phase 6 exit, WP-6.6-fix1).
      - name: Build examples
        run: bun run examples:build

      # CI runners ship no browsers, and this repository deliberately keeps
      # browser downloads out of the local scripts: the dev sandbox already has
      # Chromium (PLAYWRIGHT_BROWSERS_PATH), which playwright.config.ts finds.
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      # Runs against the example built above; SwiftShader supplies WebGL 2.
      - name: Browser test
        run: bun run test:browser

      - name: Check bundle size
        run: bun run size

      - name: Cross-package test suites
        run: bun run test:suites

      # Critical advisories block the pipeline (2026-09-11); high and below
      # stay visible in the log without failing it, since a transitive
      # advisory with no upstream fix must not freeze every PR.
      - name: Audit dependencies (visibility, high and above)
        run: bun audit --audit-level=high
        continue-on-error: true
      - name: Audit dependencies (gate, critical)
        run: bun audit --audit-level=critical
