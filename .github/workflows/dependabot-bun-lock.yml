name: Dependabot bun.lock

# Dependabot uses the npm ecosystem on purpose (see .github/dependabot.yml): its
# bun parser only supports bun.lock lockfileVersion 1, and this repo writes
# version 2, so Dependabot cannot propose updates if we switch the ecosystem
# and cannot write bun.lock if we stay on npm.
#
# CI (and docs/release) run `bun install --frozen-lockfile`. A bump whose
# resolution changes therefore fails until bun.lock is regenerated. This
# workflow is that follow-up: Dependabot PRs only (same-repo, dependabot[bot]),
# `bun install` (not frozen), commit bun.lock if it changed, push. A human
# push would cost the PR its automerge; github-actions[bot] does not.
#
# Trigger is pull_request, not pull_request_target — we never check out a PR
# with write credentials on a fork workflow. Dependabot PRs come from this
# repo.
#
# THE HELD RUNS, AND WHY THE LAST STEP IS NOT OPTIONAL. The lockfile push uses GITHUB_TOKEN.
# GitHub DOES create pull_request runs for that push, but it holds each one at
# `action_required`, so the PR reads BLOCKED until someone approves them. Measured 2026-10-02
# with a control in the same window: a `workflow_dispatch` run on the same commit goes green
# but never reaches the PR's check rollup, so it cannot satisfy the required checks, and
# "[skip ci]" removes the held runs and leaves the PR with no checks at all. Only the held
# pull_request runs can gate the PR, so the last step approves them. It approves only runs on
# the commit this job pushed and only runs that this job's own token triggered. That commit
# changes only the lockfile (the commit step stages nothing else), and its workflow files are
# the files that Dependabot's own head already ran without approval, so the approval grants
# nothing new. The approved run of THIS workflow finds bun.lock in sync and
# stops, so the chain ends after one round. The main CI job keeps --frozen-lockfile; this
# does not weaken the gate.

on:
  pull_request:
    branches: [main]

# One regeneration at a time per Dependabot branch. A force-push from
# Dependabot should cancel the in-flight run rather than race two pushes.
concurrency:
  group: dependabot-bun-lock-${{ github.head_ref }}
  # Only a Dependabot push cancels an in-flight run. The run that the approve step releases
  # (actor github-actions[bot]) WAITS instead: cancelling would kill the approving job before
  # it approves the CI runs.
  cancel-in-progress: ${{ github.actor == 'dependabot[bot]' }}

jobs:
  regenerate-lockfile:
    name: Regenerate bun.lock
    if: >-
      (github.actor == 'dependabot[bot]'
        || github.event.pull_request.user.login == 'dependabot[bot]')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # NO measured envelope exists: every run of this workflow to date was `skipped` by the
    # `if:` guard above in 1-4s, so nothing has ever executed its steps. A workflow that has
    # never actually run is the worst possible place to trust a percentile, so this bound is
    # sized to the WORK (a `bun install` and a push, not a test tier) rather than to history.
    timeout-minutes: 10
    # Repo default workflow permissions are read (2026-09-05).
    # contents:write to push bun.lock; actions:write to approve the pull_request runs that
    # GitHub holds after that push (see THE HELD RUNS above).
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Regenerate bun.lock
        run: bun install

      - name: Commit and push bun.lock if it changed
        id: commit
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if [ -f bun.lockb ]; then
            git add bun.lockb
          fi
          if git diff --cached --quiet; then
            echo "bun.lock unchanged — nothing to push"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "deps: regenerate bun.lock"
          git push origin "HEAD:$HEAD_REF"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Approve the pull_request runs that GitHub holds after the push above. They are the only
      # runs that can satisfy the PR's required checks (see THE HELD RUNS in the header).
      - name: Approve the CI runs held on the regenerated commit
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          ours() {
            gh api "repos/$GH_REPO/actions/runs?head_sha=$SHA&event=pull_request" --jq \
              '.workflow_runs[] | select(.actor.login == "github-actions[bot]") | "\(.id) \(.status)"'
          }
          # The runs appear a few seconds after the push, and not always together: wait for the
          # first one, then 15 s more for the others.
          runs=""
          for _ in $(seq 1 24); do
            runs=$(ours)
            [ -n "$runs" ] && break
            sleep 5
          done
          if [ -z "$runs" ]; then
            echo "::error::GitHub created no pull_request run for $SHA in 120 s, so the PR has no CI on its head."
            exit 1
          fi
          sleep 15
          ours | while read -r id status; do
            if [ "$status" = action_required ]; then
              gh api -X POST "repos/$GH_REPO/actions/runs/$id/approve" > /dev/null
              echo "approved run $id"
            else
              echo "run $id is $status - no approval needed"
            fi
          done
