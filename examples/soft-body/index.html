<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fourJS — Soft Bodies</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0d13;
        font:
          14px/1.5 system-ui,
          sans-serif;
        color: #9aa3b2;
      }

      main {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        align-items: center;
      }

      p {
        margin: 0;
        max-width: 800px;
      }

      #status[data-state="loading"] {
        color: #6c7486;
        font-style: italic;
      }

      #status[data-state="error"] {
        color: #d97070;
      }

      #scene {
        width: 800px;
        height: 600px;
        max-width: 100%;
        display: block;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <main>
      <canvas id="scene" width="800" height="600"></canvas>
      <p>
        fourJS — soft bodies (RFC 0011): a <strong>cloth</strong> pinned at two
        corners and a <strong>rope</strong> pinned at one end, both released
        from horizontal and simulated by position-based dynamics at a fixed 1/60
        s step. Their vertices are written into dynamic geometry each step.
      </p>
      <p id="status" data-state="loading">starting…</p>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
