<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fourJS — Canvas 2D backend</title>
    <style>
      body {
        margin: 0;
        background: #14161c;
        color: #9aa3b2;
        font:
          14px/1.5 system-ui,
          sans-serif;
      }
      main {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        align-items: center;
        padding: 1rem;
      }
      #scene {
        width: 400px;
        height: 300px;
        max-width: 100%;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <main>
      <canvas id="scene" width="400" height="300"></canvas>
      <p>
        The same scene model as the WebGL examples, drawn by
        <code>@fourjs/render-canvas</code> as filled projected polygons.
      </p>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
